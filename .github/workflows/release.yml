name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0.0). Dry-run only — real releases come from tag pushes.'
        required: false
        default: '0.0.0.0'

jobs:
  build:
    name: Build, package, publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to push the manifest.json update back to main
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install jprm
        run: pip install --upgrade jprm

      - name: Fetch annotated tag objects
        # actions/checkout@v4 with fetch-depth: 0 grabs commits but does
        # NOT necessarily materialize annotated tag objects (the tag
        # name resolves to the commit, the tag's own metadata stays
        # remote). Without this explicit fetch, `git tag -l --format=
        # '%(contents)' v$VERSION` returns empty for annotated tags and
        # we silently fall back to the commit message — which becomes
        # the manifest's user-visible changelog. Force-fetch to be safe.
        if: startsWith(github.ref, 'refs/tags/v')
        run: git fetch --tags --force --prune origin

      - name: Determine version + changelog
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            # Pull the annotated tag's message body as the changelog
            # (`%(contents:body)` skips the subject line so we don't
            # double-up if the user repeats the version in the tag's
            # subject). Falls back to `%(contents)` (full message) if
            # the body is empty, then to the commit subject only as a
            # last resort. We deliberately do NOT fall back to the full
            # commit message — it tends to contain implementation detail
            # that confuses end-users reading the plugin catalog.
            CHANGELOG="$(git tag -l --format='%(contents:body)' "v$VERSION")"
            if [[ -z "$CHANGELOG" ]]; then
              CHANGELOG="$(git tag -l --format='%(contents)' "v$VERSION")"
            fi
            if [[ -z "$CHANGELOG" ]]; then
              # Lightweight tag (no annotation). Use commit *subject* only,
              # not the full message — keeps catalog text terse.
              CHANGELOG="$(git log -1 --pretty=%s "v$VERSION")"
            fi
            # Strip trailing blank lines.
            CHANGELOG="$(printf '%s' "$CHANGELOG" | sed -e :a -e '/^[[:space:]]*$/{$d;N;ba' -e '}')"
            if [[ -z "$CHANGELOG" ]]; then
              echo "::error::Tag v$VERSION has no annotation and no commit subject — refusing to publish with empty changelog. Re-tag with: git tag -a v$VERSION -m 'user-facing release notes'"
              exit 1
            fi
          else
            VERSION="${{ github.event.inputs.version }}"
            CHANGELOG="Dry-run build"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Multiline output via heredoc delimiter so newlines survive.
          {
            echo 'changelog<<YTT_CHANGELOG_EOF'
            echo "$CHANGELOG"
            echo 'YTT_CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"
          echo "----- Changelog (will be embedded in manifest.json) -----"
          echo "$CHANGELOG"
          echo "----- end changelog -----"

      - name: Patch build.yaml changelog
        # jprm reads build.yaml's `changelog:` field and embeds it into the
        # zip's meta.json. Patching the YAML in-place before build is the
        # cleanest way to inject per-release notes without touching jprm.
        # (manifest.json itself is written later by scripts/update-manifest.py.)
        run: |
          python3 <<'PY'
          import os
          path = 'Jellyfin.Plugin.YouTubeTrailers/build.yaml'
          changelog = os.environ['CHANGELOG'].rstrip() + '\n'
          # Hand-roll the rewrite to preserve YAML formatting / comments
          # we'd lose with a full PyYAML round-trip.
          with open(path) as f:
              lines = f.readlines()
          out = []
          i = 0
          while i < len(lines):
              if lines[i].startswith('changelog:'):
                  out.append('changelog: |\n')
                  for cl in changelog.splitlines():
                      out.append('  ' + cl + '\n')
                  # Skip the existing changelog block (any indented continuation lines).
                  i += 1
                  while i < len(lines) and (lines[i].startswith('  ') or lines[i].strip() == ''):
                      i += 1
                  continue
              out.append(lines[i])
              i += 1
          with open(path, 'w') as f:
              f.writelines(out)
          print(f'Patched {path} with {len(changelog.splitlines())} changelog lines')
          PY
        env:
          CHANGELOG: ${{ steps.version.outputs.changelog }}

      - name: Setup .NET 10 (for the Jellyfin 12 build)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build plugin zips (one per Jellyfin ABI)
        id: build
        run: |
          # The plugin supports two Jellyfin majors, which need different
          # target frameworks and different Jellyfin SDK packages:
          #   Jellyfin 10.11  -> net9.0,  targetAbi 10.11.0.0
          #   Jellyfin 12     -> net10.0, targetAbi 12.0.0.0
          # jprm builds one at a time from build.yaml, so patch the two fields
          # it reads and run it once per ABI, stashing each zip under a distinct
          # name (jprm's own filename is <name>_<version>.zip for both).
          mkdir -p artifacts dist
          VERSION="${{ steps.version.outputs.version }}"

          build_abi() {
            local framework="$1" abi="$2" suffix="$3"
            python3 - "$framework" "$abi" <<'PY'
          import sys, pathlib
          framework, abi = sys.argv[1], sys.argv[2]
          path = pathlib.Path('Jellyfin.Plugin.YouTubeTrailers/build.yaml')
          out = []
          for line in path.read_text().splitlines(keepends=True):
              if line.startswith('framework:'):
                  out.append(f'framework: {framework}\n')
              elif line.startswith('targetAbi:'):
                  out.append(f'targetAbi: {abi}\n')
              else:
                  out.append(line)
          path.write_text(''.join(out))
          print(f'build.yaml -> framework={framework} targetAbi={abi}')
          PY
            rm -f artifacts/*.zip
            jprm --verbosity=debug plugin build --version="$VERSION" Jellyfin.Plugin.YouTubeTrailers
            local built
            built=$(ls artifacts/*.zip | head -1)
            cp "$built" "dist/youtube-trailers_${VERSION}_${suffix}.zip"
            echo "  $suffix -> dist/youtube-trailers_${VERSION}_${suffix}.zip"
          }

          build_abi net9.0  10.11.0.0 jf10.11
          build_abi net10.0 12.0.0.0  jf12

          {
            echo "zip_jf1011=dist/youtube-trailers_${VERSION}_jf10.11.zip"
            echo "zip_jf12=dist/youtube-trailers_${VERSION}_jf12.zip"
          } >> "$GITHUB_OUTPUT"
          ls -la dist/

      - name: Update manifest.json on main
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CHANGELOG: ${{ steps.version.outputs.changelog }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Land the manifest commit on main, not the tag — rebase in case main
          # moved during the build.
          git fetch origin main
          git checkout -B main origin/main

          # Deliberately NOT `jprm repo add`: it de-duplicates by version, so a
          # second artifact for the same version replaces the first. We publish
          # one build per Jellyfin major under a single version, so jprm would
          # silently drop one and strand that audience on the previous release.
          # scripts/update-manifest.py writes both entries in the order that
          # makes each server resolve to its own build.
          printf '%s' "$CHANGELOG" > /tmp/changelog.txt
          BASE="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          python3 scripts/update-manifest.py \
            --version "${{ steps.version.outputs.version }}" \
            --changelog-file /tmp/changelog.txt \
            --entry "${{ steps.build.outputs.zip_jf1011 }}=10.11.0.0=$BASE/$(basename '${{ steps.build.outputs.zip_jf1011 }}')" \
            --entry "${{ steps.build.outputs.zip_jf12 }}=12.0.0.0=$BASE/$(basename '${{ steps.build.outputs.zip_jf12 }}')"

          if git diff --quiet manifest.json; then
            echo "manifest.json unchanged"
          else
            git add manifest.json
            git commit -m "Publish ${{ github.ref_name }} to manifest"
            git push origin main
          fi

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.build.outputs.zip_jf1011 }}
            ${{ steps.build.outputs.zip_jf12 }}
          generate_release_notes: true
          fail_on_unmatched_files: true
